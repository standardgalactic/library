<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Relegated Structure | Audio Oscilloscope</title>
<style>
:root{color-scheme:dark;--bg:#08090c;--line:#333b42;--ink:#d5dfd5;--violet:#b5a2d8;--green:#a6cdb7}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font:12px/1.5 'Courier New',monospace;display:flex;justify-content:center;align-items:center;padding:28px 18px}main{width:min(850px,100%)}header{display:flex;justify-content:space-between;gap:15px;align-items:baseline;margin-bottom:15px;border-bottom:1px solid var(--line);padding-bottom:11px}h1{font-size:clamp(15px,3vw,21px);font-weight:normal;letter-spacing:.13em;text-transform:uppercase;margin:0}small,.muted{color:#87918d;letter-spacing:.12em}.screen{position:relative;border:1px solid #4c5656;background:#070b0c;box-shadow:inset 0 0 55px #111a18,0 0 30px #000;aspect-ratio: 1.9;overflow:hidden}.screen:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,transparent 0,transparent 3px,#ffffff05 4px);opacity:.65}canvas{display:block;width:100%;height:100%}.screen-label{position:absolute;top:12px;left:15px;color:#8f9b95;font-size:10px;letter-spacing:.16em;pointer-events:none}.screen-label.right{left:auto;right:15px}.controls{display:flex;align-items:center;gap:14px;padding:19px 0 9px}button{background:transparent;border:1px solid #64716e;color:var(--ink);padding:9px 14px;cursor:pointer;font:inherit;letter-spacing:.12em;min-width:86px}button:hover,button:focus-visible{border-color:#c1d3ca;outline:none}#seek{width:100%;accent-color:#a6cdb7;cursor:pointer;min-width:80px}#clock{white-space:nowrap;font-variant-numeric:tabular-nums;color:#b9c9bf}#caption{min-height:4.2em;display:grid;place-items:center;text-align:center;margin:12px auto 8px;max-width:740px;padding:8px 14px;font-size:clamp(13px,2.2vw,16px);line-height:1.5;color:#dbe4dc}footer{border-top:1px solid var(--line);padding-top:14px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}a{color:#c0d3c7;text-decoration:none;border-bottom:1px solid #5d7468}a:hover{text-decoration:underline}#status{color:#8b9a91}@media(max-width:540px){header{display:block}header small{display:block;margin-top:8px}.screen{aspect-ratio:1.3}.controls{gap:8px}button{min-width:64px;padding:8px}#clock{font-size:10px}footer{display:block}footer span{display:block;margin-top:10px}}
</style>
</head>
<body><main>
<header><h1>Relegated Structure</h1><small>DUAL TRACE / AUDIO STUDY</small></header>
<div class="screen"><canvas id="scope" aria-label="Audio-reactive dual channel oscilloscope"></canvas><div class="screen-label">CH A / CH B</div><div class="screen-label right">TIMEBASE · LIVE</div></div>
<div class="controls"><button id="toggle" type="button">PLAY</button><input id="seek" type="range" min="0" max="1000" step="1" value="0" aria-label="Seek through audio"><span id="clock">00:00 / 00:00</span></div>
<div id="caption" aria-live="off">LOADING SUBTITLES…</div>
<footer><a href="https://standardgalactic.github.io/library/relegated-structure.pdf" target="_blank" rel="noopener noreferrer">READ THE ESSAY · RELEGATED STRUCTURE</a><span id="status">STANDBY</span></footer>
<audio id="audio" preload="metadata" src="Why_System_1_and_2_Don_t_Exist.mp3"></audio>
</main>
<script>
'use strict';
const audio=document.getElementById('audio'),button=document.getElementById('toggle'),seek=document.getElementById('seek'),clock=document.getElementById('clock'),caption=document.getElementById('caption'),status=document.getElementById('status'),canvas=document.getElementById('scope'),g=canvas.getContext('2d');
let context,analyser,data,cues=[],subtitleState='LOADING SUBTITLES…',dragging=false;
function fmt(s){if(!Number.isFinite(s))return '00:00';s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function duration(){return Number.isFinite(audio.duration)&&audio.duration>0?audio.duration:0}
function updateClock(preview=null){const d=duration(),t=preview===null?audio.currentTime:preview;clock.textContent=fmt(t)+' / '+fmt(d)}
function updateSeek(){if(!dragging&&duration())seek.value=String(Math.round(audio.currentTime/duration()*1000));updateClock()}
function initialize(){if(context)return;context=new(window.AudioContext||window.webkitAudioContext)();analyser=context.createAnalyser();analyser.fftSize=2048;analyser.smoothingTimeConstant=.45;data=new Uint8Array(analyser.fftSize);const source=context.createMediaElementSource(audio);source.connect(analyser);analyser.connect(context.destination)}
button.addEventListener('click',async()=>{try{initialize();if(context.state==='suspended')await context.resume();if(audio.paused)await audio.play();else audio.pause()}catch(e){console.error(e);status.textContent='PLAYBACK ERROR'}});
audio.addEventListener('play',()=>{button.textContent='PAUSE';status.textContent='PLAYING'});
audio.addEventListener('pause',()=>{button.textContent='PLAY';status.textContent=audio.ended?'COMPLETE':'PAUSED'});
audio.addEventListener('ended',()=>{button.textContent='REPLAY';status.textContent='COMPLETE'});
audio.addEventListener('error',()=>{status.textContent='AUDIO LOAD ERROR'});
audio.addEventListener('loadedmetadata',updateSeek);
audio.addEventListener('durationchange',updateSeek);
audio.addEventListener('timeupdate',()=>{updateSeek();updateCaption()});
audio.addEventListener('seeked',()=>{updateSeek();updateCaption()});
// A range input has native click and drag semantics. Its events never toggle playback.
seek.addEventListener('pointerdown',()=>{dragging=true});
seek.addEventListener('input',()=>{dragging=true;if(duration())updateClock(Number(seek.value)/1000*duration())});
function commitSeek(){if(!duration()){dragging=false;return}const target=Number(seek.value)/1000*duration();audio.currentTime=Math.min(target,duration());dragging=false;updateClock(target);updateCaption()}
seek.addEventListener('change',commitSeek);
seek.addEventListener('pointerup',()=>{if(dragging)commitSeek()});
seek.addEventListener('pointercancel',()=>{dragging=false;updateSeek()});
function timestamp(s){const p=s.trim().replace(',','.').split(':').map(Number);if(p.some(x=>!Number.isFinite(x)))return NaN;return p.length===3?p[0]*3600+p[1]*60+p[2]:p.length===2?p[0]*60+p[1]:NaN}
async function subtitles(){try{const r=await fetch('Why_System_1_and_2_Don_t_Exist.vtt',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const txt=(await r.text()).replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n');const found=[];for(const block of txt.split(/\n\s*\n/)){const lines=block.trim().split('\n');const i=lines.findIndex(x=>x.includes('-->'));if(i<0)continue;const [a,b]=lines[i].split('-->');if(!b)continue;const start=timestamp(a),end=timestamp(b.trim().split(/\s+/)[0]);const content=lines.slice(i+1).join(' ').replace(/<[^>]*>/g,'').replace(/\s+/g,' ').trim();if(Number.isFinite(start)&&Number.isFinite(end)&&end>start&&content)found.push({start,end,content})}cues=found.sort((a,b)=>a.start-b.start);subtitleState=cues.length?'SUBTITLES READY':'NO CUES FOUND';caption.textContent=subtitleState}catch(e){console.warn('VTT:',e);subtitleState='SUBTITLES UNAVAILABLE';caption.textContent=subtitleState}}
function updateCaption(){const t=audio.currentTime;let result='';for(const cue of cues){if(cue.start>t)break;if(t>=cue.start&&t<cue.end)result=cue.content}caption.textContent=result||(!audio.currentTime?subtitleState:'')}
subtitles();
function resize(){const r=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);const w=Math.round(r.width*dpr),h=Math.round(r.height*dpr);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}g.setTransform(dpr,0,0,dpr,0,0)}
function trace(w,h,offset,color,alpha){if(!data)return;g.beginPath();const step=w/(data.length-1);for(let i=0;i<data.length;i++){const x=i*step;const a=(data[i]-128)/128;const y=h*.5+a*h*.31+offset;if(i===0)g.moveTo(x,y);else g.lineTo(x,y)}g.strokeStyle=color;g.globalAlpha=alpha;g.lineWidth=1.35;g.shadowBlur=8;g.shadowColor=color;g.stroke();g.shadowBlur=0;g.globalAlpha=1}
function frame(){resize();const w=canvas.clientWidth,h=canvas.clientHeight;g.fillStyle='#070b0c';g.fillRect(0,0,w,h);g.strokeStyle='rgba(154,176,163,.12)';g.lineWidth=1;for(let x=0;x<=w;x+=w/12){g.beginPath();g.moveTo(x,0);g.lineTo(x,h);g.stroke()}for(let y=0;y<=h;y+=h/8){g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke()}g.strokeStyle='rgba(190,210,194,.25)';g.beginPath();g.moveTo(0,h/2);g.lineTo(w,h/2);g.stroke();if(analyser){analyser.getByteTimeDomainData(data);trace(w,h,-h*.025,'#b5a2d8',.85);trace(w,h,h*.025,'#a6cdb7',.65)}else{g.strokeStyle='#81958b';g.beginPath();g.moveTo(0,h/2);g.lineTo(w,h/2);g.stroke()}requestAnimationFrame(frame)}frame();
</script></body></html>
